[project]
name = "factor-alloc"
version = "0.1.0"
description = "Point-in-time factor allocation research on free public data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "openassetpricing",
    "polars<2",  # polars 2 uses HTTP range requests, which Google Drive rejects
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factor_alloc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
